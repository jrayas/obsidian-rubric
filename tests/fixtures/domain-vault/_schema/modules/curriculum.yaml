module: curriculum
properties:
  domain:
    type: enum
    required: true
    values: [pcb, demo]
    prefixes: {pcb: PC, demo: DM}
  unique_id:
    type: string
    pattern: '^[A-Z]{2}-[A-Z]{2}-\d{4}-\d{4,}$'
    locked: true
    generated: true
  section:
    type: enum
    required: true
    values: [pcb-start-here, pcb-core]
    description: Every value starts with its domain and a hyphen.
  level:
    type: enum
    required: true
    values: [beginner, intermediate, advanced]
  order:
    type: integer
    required: true
    min: 1
  track:
    type: list
    items: term
    vocabulary: tracks
    strict: true
    normalise: true
    default: []
