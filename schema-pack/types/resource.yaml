type: resource
description: A book, article, video or other resource.
uses: [base, findability, relations]
overrides:
  status:
    values: [to-consume, in-progress, done, abandoned]
    default: to-consume
properties:
  resource_type:
    type: enum
    values: [book, article, video, podcast, course, paper, tool, required]
  creator:
    type: string
  url:
    type: url
  published:
    type: date
  rating:
    type: integer
    min: 1
    max: 5
  takeaways:
    type: link
  progress_percent:
    type: integer
    min: 0
    max: 100
    default: 0
  progress_started:
    type: date
  progress_finished:
    type: date
