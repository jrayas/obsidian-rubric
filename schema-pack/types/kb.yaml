type: kb
description: A knowledge-base note.
uses: [base, findability, taxonomy, relations, provenance, review]
overrides:
  status:
    values: [draft, review, published, outdated, archived]
    default: draft
properties:
  kind:
    type: enum
    values: [concept, how-to, reference, troubleshooting, faq]
    default: concept
  audience:
    type: enum
    values: [self, team, public]
    default: self
  confidence:
    type: enum
    values: [low, medium, high]
    default: medium
