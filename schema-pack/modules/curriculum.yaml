module: curriculum
description: Where a note sits in a reading path (domain, section, level and order). A domain can change the defaults without forking the schema; see types/kb/ for examples.
properties:
  domain:
    type: enum
    required: true
    values: [general, maths, physics, pcb, embedded]
    default: general
    prefixes: {general: GE, maths: MA, physics: PY, pcb: PC, embedded: EM}
    description: The knowledge domain. Append a value to add a domain, give it a two-letter prefix under prefixes (unique, declared and not guessed from the word), then add override files for it if it needs different values. Never rename one.
  unique_id:
    type: string
    pattern: '^[A-Z]{2}-[A-Z]{2}-\d{4}-\d{4,}$'
    locked: true
    generated: true
    description: Readable ID within a domain, TYPE-DOMAIN-YEAR-NNNN, with its own counter per type, domain and year. Set by the plugin. Issued again when the note's domain changes, and the old one is kept in archived_fields. Link to a note by its id, never by this.
  section:
    type: enum
    required: true
    values: [general-start-here, general-reference]
    default: general-start-here
    description: Subject area. Every value starts with its domain and a hyphen. A domain adds its own with sections in modules/curriculum/<domain>.yaml.
  level:
    type: enum
    required: true
    values: [beginner, intermediate, advanced]
    default: beginner
    description: Who the note is for.
  topic:
    type: string
    description: Short free-text subtopic.
  order:
    type: integer
    required: true
    min: 1
    default: 10
    description: Reading order within a section. Use gaps of 10.
  track:
    type: list
    items: term
    vocabulary: tracks
    strict: true
    normalise: true
    default: []
    description: Named learning paths this note belongs to.
