module: curriculum
description: Where a note sits in a reading path (section, level and order). A domain can change the defaults without forking the schema; see modules/curriculum/ and types/kb/ for examples.
requires: [domain]
properties:
  section:
    type: enum
    required: true
    values: [general-start-here, general-reference]
    default: general-start-here
    description: Subject area. Every value starts with its domain and a hyphen. A domain adds its own with sections in modules/curriculum/<domain>.yaml.
  level:
    type: enum
    required: true
    values: [beginner, intermediate, advanced]
    default: beginner
    description: Who the note is for.
  topic:
    type: string
    description: Short free-text subtopic.
  order:
    type: integer
    required: true
    min: 1
    default: 10
    description: Reading order within a section. Use gaps of 10.
  track:
    type: list
    items: term
    vocabulary: tracks
    strict: true
    normalise: true
    default: []
    description: Named learning paths this note belongs to.
