module: domain
description: Which knowledge domain a note belongs to, and its readable ID within that domain. The domains are listed in registry/domains.yaml.
properties:
  domain:
    type: enum
    required: true
    values_from: domains
    description: The knowledge domain, from registry/domains.yaml. A new note takes it from its folder (Knowledge/maths/ is maths), or the default domain. Override files named after a domain change the schema for notes in it. Never rename one.
  unique_id:
    type: string
    pattern: '^[A-Z]{2}-[A-Z]{2}-\d{4}-\d{4,}$'
    locked: true
    generated: true
    description: Readable ID within a domain, TYPE-DOMAIN-YEAR-NNNN, with its own counter per type, domain and year. Needs a prefix for the domain in registry/domains.yaml. Set by the plugin. Issued again when the note's domain changes, and the old one is kept in archived_fields. Link to a note by its id, never by this.
